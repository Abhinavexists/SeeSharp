[project]
name = "seesharp"
version = "0.1.0"
description = "PyTorch implementation of the ERSVR (Enhanced Real-time Video Super Resolution) network using recurrent multi-branch dilated convolutions"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "einops==0.8.1",
  "flask==3.1.1",
  "matplotlib==3.10.3",
  "numpy==2.3.1",
  "opencv-python==4.11.0.86",
  "Pillow==11.2.1",
  "requests==2.32.4",
  "tensorboard",
  "torch==2.7.0",
  "tqdm==4.67.1"
]
